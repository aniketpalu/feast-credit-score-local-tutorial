project: credit_scoring_local
registry: data/registry.db
provider: local
online_store:
  type: redis
  connection_string: "feast-redis.default.svc.cluster.local:6379"
offline_store:
    type: postgres
    host: postgres-customer.default.svc.cluster.local
    port: 5432
    database: creditrisk
    db_schema: public
    user: feastuser
    password: feastpass
entity_key_serialization_version: 3